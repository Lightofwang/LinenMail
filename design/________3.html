<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <div class="min-h-screen bg-light-surface flex flex-col items-center justify-center px-gutter-xl py-gutter-xl gap-gutter-lg">

    <!-- Brand Top Row -->
    <div class="w-full max-w-2xl flex items-center justify-start">
      <div class="flex items-center gap-gutter-sm">
        <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-light-primary text-light-on-primary">
          <span class="material-symbols-outlined text-title-lg" aria-hidden="true">mail</span>
        </span>
        <span class="font-headline text-title-lg text-light-on-surface">素笺 LinenMail</span>
      </div>
    </div>

    <!-- Centered Onboarding Connect Card -->
    <main class="w-full max-w-2xl bg-light-surface-container-lowest rounded-xl p-gutter-xl shadow-[0_12px_36px_-8px_rgba(35,25,20,0.07)] flex flex-col gap-gutter-lg">
      <div class="flex flex-col gap-gutter-xs">
        <h1 class="font-headline text-headline-lg text-light-on-surface text-balance">欢迎使用素笺，先链接一个常用邮箱</h1>
        <p class="font-body text-body-md text-light-on-surface-variant text-pretty">无需单独注册账号，选择邮箱服务商一键授权，或填写 IMAP / SMTP 参数直连同步。</p>
      </div>

      <!-- Provider Quick-Pick Grid -->
      <div class="grid grid-cols-4 gap-gutter-sm" role="radiogroup" aria-label="选择邮箱服务商">
        <button type="button" data-provider="imap" class="provider-card flex flex-col items-center gap-gutter-xs p-gutter-md rounded-xl bg-light-surface-container-low ring-1 ring-light-primary text-light-on-surface transition-colors duration-state-change">
          <span class="material-symbols-outlined text-title-lg text-light-primary" aria-hidden="true">dns</span>
          <span class="font-label text-label-md">自定义 IMAP</span>
        </button>
        <button type="button" data-provider="gmail" class="provider-card flex flex-col items-center gap-gutter-xs p-gutter-md rounded-xl bg-light-surface-container-low/60 hover:bg-light-surface-container-low text-light-on-surface-variant transition-colors duration-state-change">
          <span class="material-symbols-outlined text-title-lg" aria-hidden="true">alternate_email</span>
          <span class="font-label text-label-md">Google 邮箱</span>
        </button>
        <button type="button" data-provider="outlook" class="provider-card flex flex-col items-center gap-gutter-xs p-gutter-md rounded-xl bg-light-surface-container-low/60 hover:bg-light-surface-container-low text-light-on-surface-variant transition-colors duration-state-change">
          <span class="material-symbols-outlined text-title-lg" aria-hidden="true">business</span>
          <span class="font-label text-label-md">Outlook / 365</span>
        </button>
        <button type="button" data-provider="qq163" class="provider-card flex flex-col items-center gap-gutter-xs p-gutter-md rounded-xl bg-light-surface-container-low/60 hover:bg-light-surface-container-low text-light-on-surface-variant transition-colors duration-state-change">
          <span class="material-symbols-outlined text-title-lg" aria-hidden="true">mark_email_read</span>
          <span class="font-label text-label-md">QQ / 163 邮箱</span>
        </button>
      </div>

      <!-- Account & Server Form -->
      <form id="connect-form" class="flex flex-col gap-gutter-md" onsubmit="event.preventDefault();">
        <div class="grid grid-cols-2 gap-gutter-md">
          <label class="flex flex-col gap-gutter-xs">
            <span class="font-label text-label-md text-light-on-surface-variant">邮箱地址</span>
            <input type="email" value="mingyuan.zhou@atelier.cn" class="w-full px-gutter-md py-gutter-sm rounded-lg bg-light-surface-container-low border-0 font-body text-body-md text-light-on-surface focus:ring-1 focus:ring-light-primary">
          </label>
          <label class="flex flex-col gap-gutter-xs">
            <span class="font-label text-label-md text-light-on-surface-variant">授权码或密码</span>
            <input type="password" value="••••••••••••" class="w-full px-gutter-md py-gutter-sm rounded-lg bg-light-surface-container-low border-0 font-body text-body-md text-light-on-surface focus:ring-1 focus:ring-light-primary">
          </label>
        </div>

        <!-- IMAP / SMTP Details -->
        <div class="grid grid-cols-12 gap-gutter-md bg-light-surface-container-low/70 rounded-xl p-gutter-md">
          <label class="col-span-8 flex flex-col gap-gutter-xs">
            <span class="font-label text-label-md text-light-on-surface-variant">接收服务器 (IMAP)</span>
            <input id="imap-host" type="text" value="imap.atelier.cn" class="w-full px-gutter-md py-gutter-sm rounded-lg bg-light-surface-container-lowest border-0 font-mono text-mono-sm text-light-on-surface focus:ring-1 focus:ring-light-primary">
          </label>
          <label class="col-span-4 flex flex-col gap-gutter-xs">
            <span class="font-label text-label-md text-light-on-surface-variant">端口</span>
            <input id="imap-port" type="text" value="993" class="w-full px-gutter-md py-gutter-sm rounded-lg bg-light-surface-container-lowest border-0 font-mono text-mono-sm tabular-nums text-light-on-surface focus:ring-1 focus:ring-light-primary">
          </label>

          <label class="col-span-8 flex flex-col gap-gutter-xs">
            <span class="font-label text-label-md text-light-on-surface-variant">发送服务器 (SMTP)</span>
            <input id="smtp-host" type="text" value="smtp.atelier.cn" class="w-full px-gutter-md py-gutter-sm rounded-lg bg-light-surface-container-lowest border-0 font-mono text-mono-sm text-light-on-surface focus:ring-1 focus:ring-light-primary">
          </label>
          <label class="col-span-4 flex flex-col gap-gutter-xs">
            <span class="font-label text-label-md text-light-on-surface-variant">端口</span>
            <input id="smtp-port" type="text" value="465" class="w-full px-gutter-md py-gutter-sm rounded-lg bg-light-surface-container-lowest border-0 font-mono text-mono-sm tabular-nums text-light-on-surface focus:ring-1 focus:ring-light-primary">
          </label>

          <div class="col-span-12 flex items-center justify-between pt-gutter-xs">
            <div class="flex items-center gap-gutter-xs text-light-on-surface-variant">
              <span class="material-symbols-outlined text-title-md text-light-secondary" aria-hidden="true">lock</span>
              <span class="font-body text-body-sm">强制启用 SSL/TLS 安全加密连接</span>
            </div>
            <span id="connection-status" class="font-label text-label-md text-light-secondary hidden">连接验证成功</span>
          </div>
        </div>

        <!-- Primary Action Row -->
        <div class="flex items-center justify-between gap-gutter-md pt-gutter-xs">
          <span class="font-body text-body-sm text-light-on-surface-variant">凭证仅加密保存在本地设备</span>

          <div class="flex items-center gap-gutter-sm">
            <button id="test-conn-btn" data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" class="inline-flex items-center justify-center px-gutter-md py-gutter-sm rounded-full bg-light-surface-container-low text-light-on-surface hover:bg-light-surface-container transition-colors duration-state-change">
              <span data-design-text-token="label-lg" class="font-label text-label-lg">测试连接</span>
            </button>

            <a href="../main-inbox/MainInboxAndReader.html" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-gutter-sm rounded-full bg-light-primary text-light-on-primary transition-colors duration-state-change hover:bg-light-primary-container focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-light-primary focus-visible:ring-offset-2">
              <span data-design-text-token="label-lg" class="font-label text-label-lg">完成配置并进入收件箱</span>
              <span class="material-symbols-outlined text-title-md" aria-hidden="true">arrow_forward</span>
            </a>
          </div>
        </div>
      </form>
    </main>
  </div>

  <script>
    const PRESETS = {
      imap: { imap: 'imap.atelier.cn', iport: '993', smtp: 'smtp.atelier.cn', sport: '465' },
      gmail: { imap: 'imap.gmail.com', iport: '993', smtp: 'smtp.gmail.com', sport: '465' },
      outlook: { imap: 'outlook.office365.com', iport: '993', smtp: 'smtp.office365.com', sport: '587' },
      qq163: { imap: 'imap.qq.com', iport: '993', smtp: 'smtp.qq.com', sport: '465' }
    };

    document.querySelectorAll('.provider-card').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.provider-card').forEach(b => {
          const active = b === btn;
          b.className = active
            ? 'provider-card flex flex-col items-center gap-gutter-xs p-gutter-md rounded-xl bg-light-surface-container-low ring-1 ring-light-primary text-light-on-surface transition-colors duration-state-change'
            : 'provider-card flex flex-col items-center gap-gutter-xs p-gutter-md rounded-xl bg-light-surface-container-low/60 hover:bg-light-surface-container-low text-light-on-surface-variant transition-colors duration-state-change';
        });
        const p = PRESETS[btn.dataset.provider];
        if (p) {
          document.getElementById('imap-host').value = p.imap;
          document.getElementById('imap-port').value = p.iport;
          document.getElementById('smtp-host').value = p.smtp;
          document.getElementById('smtp-port').value = p.sport;
        }
      });
    });

    document.getElementById('test-conn-btn').addEventListener('click', () => {
      const status = document.getElementById('connection-status');
      status.classList.remove('hidden');
    });
  </script>


</body></html>
