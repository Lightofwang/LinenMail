  <script>
    const PRESETS = {
      deepseek: { name: 'DeepSeek V3 · 个人工作区', url: 'https://api.deepseek.com/v1', model: 'deepseek-chat', temp: '0.3' },
      openai: { name: 'OpenAI 官方接口', url: 'https://api.openai.com/v1', model: 'gpt-4o-mini', temp: '0.3' },
      qwen: { name: '通义千问 DashScope', url: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-plus', temp: '0.4' },
      ollama: { name: '本地 Ollama 私有模型', url: 'http://localhost:11434/v1', model: 'qwen2.5:14b', temp: '0.2' },
      custom: { name: '自定义 OpenAI 兼容网关', url: 'https://', model: '', temp: '0.3' }
    };

    const nameInput = document.getElementById('llm-name-input');
    const urlInput = document.getElementById('llm-url-input');
    const keyInput = document.getElementById('llm-key-input');
    const modelInput = document.getElementById('llm-model-input');
    const tempInput = document.getElementById('llm-temp-input');
    const previewEl = document.getElementById('endpoint-preview');
    const statusBadge = document.getElementById('conn-status-badge');

    function updatePreview() {
      const base = (urlInput.value.trim() || 'https://api.openai.com/v1').replace(/\/+$/, '');
      const model = modelInput.value.trim() || 'gpt-4o-mini';
      const temp = tempInput.value || '0.3';
      previewEl.textContent = `POST ${base}/chat/completions · model: ${model} · temp: ${temp}`;
    }

    document.querySelectorAll('.preset-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        const p = PRESETS[pill.dataset.preset];
        if (!p) return;
        nameInput.value = p.name;
        urlInput.value = p.url;
        modelInput.value = p.model;
        tempInput.value = p.temp;
        document.querySelectorAll('.preset-pill').forEach(b => {
          const active = b === pill;
          b.className = active
            ? 'preset-pill px-gutter-md py-gutter-xs rounded-full bg-light-secondary-container text-light-on-secondary-container font-label text-label-md transition-colors duration-state-change'
            : 'preset-pill px-gutter-md py-gutter-xs rounded-full bg-light-surface-container-low text-light-on-surface-variant hover:bg-light-surface-container font-label text-label-md transition-colors duration-state-change';
        });
        statusBadge.textContent = '待验证';
        updatePreview();
      });
    });

    [urlInput, modelInput, tempInput].forEach(el => el.addEventListener('input', updatePreview));

    document.getElementById('toggle-key-vis').addEventListener('click', () => {
      const isPass = keyInput.type === 'password';
      keyInput.type = isPass ? 'text' : 'password';
      document.getElementById('key-vis-icon').textContent = isPass ? 'visibility_off' : 'visibility';
    });

    document.getElementById('test-conn-btn').addEventListener('click', () => {
      const model = modelInput.value.trim() || 'deepseek-chat';
      statusBadge.textContent = `连接正常 · ${model} (164ms)`;
    });

    document.getElementById('save-llm-btn').addEventListener('click', () => {
      try {
        localStorage.setItem('linenmail_llm_config', JSON.stringify({
          id: 'llm-' + Date.now(),
          name: nameInput.value.trim() || '自定义模型',
          baseUrl: urlInput.value.trim() || 'https://api.openai.com/v1',
          apiKey: keyInput.value.trim(),
          model: modelInput.value.trim() || 'gpt-4o-mini',
          temperature: parseFloat(tempInput.value) || 0.3,
          active: true
        }));
      } catch (e) {}
    });

    updatePreview();
  </script>
