  <script>
    const CONDITIONS = [
      { field: '发件人', op: '包含', value: 'billing@' },
      { field: '主题', op: '包含', value: '发票' }
    ];
    let logicMode = 'AND';

    function renderConditions() {
      const container = document.getElementById('condition-rows');
      container.innerHTML = CONDITIONS.map((c, idx) => `
        <div class="flex items-center gap-gutter-sm bg-light-surface-container-low/70 p-gutter-xs rounded-xl">
          <select data-idx="${idx}" data-key="field" class="cond-select px-gutter-md py-gutter-xs rounded-lg bg-light-surface-container-lowest border-0 font-label text-label-md text-light-on-surface focus:ring-1 focus:ring-light-primary">
            <option ${c.field === '发件人' ? 'selected' : ''}>发件人</option>
            <option ${c.field === '收件人' ? 'selected' : ''}>收件人</option>
            <option ${c.field === '主题' ? 'selected' : ''}>主题</option>
            <option ${c.field === '正文' ? 'selected' : ''}>正文</option>
          </select>
          <select data-idx="${idx}" data-key="op" class="cond-select px-gutter-md py-gutter-xs rounded-lg bg-light-surface-container-lowest border-0 font-label text-label-md text-light-on-surface focus:ring-1 focus:ring-light-primary">
            <option ${c.op === '包含' ? 'selected' : ''}>包含</option>
            <option ${c.op === '不包含' ? 'selected' : ''}>不包含</option>
            <option ${c.op === '完全等于' ? 'selected' : ''}>完全等于</option>
          </select>
          <input
            type="text"
            data-idx="${idx}"
            value="${c.value}"
            placeholder="输入匹配关键词或邮箱..."
            class="cond-input flex-1 px-gutter-md py-gutter-xs rounded-lg bg-light-surface-container-lowest border-0 font-body text-body-md text-light-on-surface focus:ring-1 focus:ring-light-primary"
          />
          <button
            type="button"
            data-remove-idx="${idx}"
            aria-label="移除条件"
            class="remove-cond-btn w-8 h-8 rounded-full inline-flex items-center justify-center text-light-on-surface-variant hover:bg-light-surface-container hover:text-light-on-surface transition-colors duration-state-change"
          >
            <span class="material-symbols-outlined text-title-md" aria-hidden="true">close</span>
          </button>
        </div>
      `).join('');
      updateSummary();
    }

    function updateSummary() {
      const joiner = logicMode === 'AND' ? ' 且 ' : ' 或 ';
      const condText = CONDITIONS.map(c => `${c.field}${c.op} "${c.value || '...'}"`).join(joiner);
      const hasAtt = document.getElementById('has-attachment-check').checked ? ' 且包含附件' : '';
      const actions = Array.from(document.querySelectorAll('.action-check:checked')).map(el => el.dataset.actionLabel);
      const actionText = actions.length ? actions.join('、') : '暂未选择处理动作';
      document.getElementById('rule-summary-text').textContent =
        `当邮件满足${logicMode === 'AND' ? '全部' : '任意'}条件（${condText}${hasAtt}）时，自动${actionText}。`;
    }

    document.getElementById('add-condition-btn').addEventListener('click', () => {
      CONDITIONS.push({ field: '主题', op: '包含', value: '' });
      renderConditions();
    });

    document.getElementById('condition-rows').addEventListener('click', (e) => {
      const btn = e.target.closest('.remove-cond-btn');
      if (btn && CONDITIONS.length > 1) {
        CONDITIONS.splice(Number(btn.dataset.removeIdx), 1);
        renderConditions();
      }
    });

    document.getElementById('condition-rows').addEventListener('input', (e) => {
      if (e.target.classList.contains('cond-input')) {
        CONDITIONS[Number(e.target.dataset.idx)].value = e.target.value;
        updateSummary();
      }
    });

    document.getElementById('condition-rows').addEventListener('change', (e) => {
      if (e.target.classList.contains('cond-select')) {
        CONDITIONS[Number(e.target.dataset.idx)][e.target.dataset.key] = e.target.value;
        updateSummary();
      }
    });

    document.querySelectorAll('.logic-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        logicMode = btn.dataset.logic;
        document.querySelectorAll('.logic-pill').forEach(b => {
          const active = b === btn;
          b.className = active
            ? 'logic-pill px-gutter-md py-gutter-xs rounded-full font-label text-label-md bg-light-surface-container-lowest text-light-on-surface shadow-sm transition-colors duration-state-change'
            : 'logic-pill px-gutter-md py-gutter-xs rounded-full font-label text-label-md text-light-on-surface-variant hover:text-light-on-surface transition-colors duration-state-change';
        });
        updateSummary();
      });
    });

    document.getElementById('has-attachment-check').addEventListener('change', updateSummary);
    document.querySelectorAll('.action-check').forEach(el => el.addEventListener('change', updateSummary));

    renderConditions();
  </script>
