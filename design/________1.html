    const saveStatusEl = document.getElementById('draft-save-status');
    const sentBannerEl = document.getElementById('sent-banner');
    const schedulePopover = document.getElementById('schedule-popover');

    // Toggle Cc row
    document.getElementById('toggle-cc-btn').addEventListener('click', () => {
      const ccRow = document.getElementById('cc-row');
      ccRow.classList.toggle('hidden');
      ccRow.classList.toggle('flex');
    });

    // Remove recipient chip
    recipientChipsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.remove-chip');
      if (btn) {
        const chip = btn.closest('.recipient-chip');
        if (chip) chip.remove();
      }
    });

    // Add recipient chip on Enter
    addRecipientInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && addRecipientInput.value.trim()) {
        e.preventDefault();
        const email = addRecipientInput.value.trim();
        const span = document.createElement('span');
        span.className = 'recipient-chip inline-flex items-center gap-gutter-xs pl-gutter-md pr-gutter-xs py-gutter-xs rounded-full bg-light-secondary-container text-light-on-secondary-container';
        span.setAttribute('data-component-id', 'chip-input');
        span.setAttribute('data-component-type', 'chip');
        span.setAttribute('data-component-variant', 'input');
        span.innerHTML = `
          <span data-design-text-token="label-md" class="font-label text-label-md">${email}</span>
          <button type="button" aria-label="移除 ${email}" class="remove-chip inline-flex items-center justify-center w-5 h-5 rounded-full hover:bg-light-surface-container-lowest transition-colors duration-state-change">
            <span class="material-symbols-outlined text-body-sm" aria-hidden="true">close</span>
          </button>
        `;
        recipientChipsEl.appendChild(span);
        addRecipientInput.value = '';
      }
    });

    // Live character count
    composeBody.addEventListener('input', () => {
      const len = composeBody.value.replace(/\s+/g, '').length;
      wordCountEl.textContent = `${len} 字`;
      saveStatusEl.textContent = '草稿已自动保存 · 刚刚';
    });

    // Remove attachment
    document.getElementById('remove-attachment-btn').addEventListener('click', () => {
      document.getElementById('attachment-strip').classList.add('hidden');
    });

    // Schedule popover
    document.getElementById('schedule-toggle-btn').addEventListener('click', () => {
      schedulePopover.classList.toggle('hidden');
      schedulePopover.classList.toggle('flex');
    });

    document.querySelectorAll('.schedule-option').forEach(btn => {
      btn.addEventListener('click', () => {
        schedulePopover.classList.add('hidden');
        schedulePopover.classList.remove('flex');
        saveStatusEl.textContent = '已加入定时发送队列';
      });
    });

    // Send action
    const triggerSend = () => {
      sentBannerEl.classList.remove('hidden');
      sentBannerEl.classList.add('flex');
      saveStatusEl.textContent = '邮件已发送';
    };
    document.getElementById('footer-send-btn').addEventListener('click', triggerSend);
    document.getElementById('save-draft-btn').addEventListener('click', () => {
      saveStatusEl.textContent = '草稿已手动保存 · 刚刚';
    });

    // AI One-Click Polish (OpenAI-compatible endpoint or local fallback)
    const polishBtn = document.getElementById('ai-polish-btn');
    const polishLabel = document.getElementById('ai-polish-label');
    const polishStatus = document.getElementById('ai-polish-status');
    const undoPolishBtn = document.getElementById('ai-undo-polish-btn');
    let originalDraftBeforePolish = null;

    function getLlmConfig() {
      try {
        const raw = localStorage.getItem('linenmail_llm_config');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { baseUrl: 'https://api.openai.com/v1', apiKey: '', model: 'gpt-4o-mini', temperature: 0.3 };
    }

    polishBtn.addEventListener('click', async () => {
      const currentText = composeBody.value.trim();
      if (!currentText) return;
      if (originalDraftBeforePolish === null) {
        originalDraftBeforePolish = composeBody.value;
      }

      const cfg = getLlmConfig();
      polishLabel.textContent = '正在美化...';

      let polishedText = '';
      if (cfg.apiKey && cfg.baseUrl) {
        try {
          const res = await fetch(`${cfg.baseUrl.replace(/\/+$/, '')}/chat/completions`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${cfg.apiKey}`
            },
            body: JSON.stringify({
              model: cfg.model || 'gpt-4o-mini',
              temperature: cfg.temperature ?? 0.3,
              messages: [
                { role: 'system', content: '你是一位专业的中文商务邮件编辑。请在不改变原意的前提下，优化以下邮件正文的措辞、结构与礼貌度，使段落更清晰自然。直接返回润色后的正文。' },
                { role: 'user', content: currentText }
              ]
            })
          });
          const data = await res.json();
          polishedText = data.choices?.[0]?.message?.content?.trim() || '';
        } catch (err) {
          // Fallback on CORS or network error
        }
      }

      if (!polishedText) {
        polishedText = `晨曦、思远，你们好：\n\n昨晚已与团队完成排版规范及同步引擎基准测试的最终核对，各项指标表现稳健，已具备上线条件。\n\n为确保平稳推进，建议接下来的发布节奏安排如下：\n1. 周四上午：完成主收件箱与智能分类视图的终版走查；\n2. 周五 15:00：启动线上灰度发布，优先面向桌面端用户开放；\n3. 下周一早会：复盘首批用户的实际阅读体验与反馈。\n\n更新后的排期表已随信附上，如有任何补充或调整建议，欢迎随时沟通。\n\n顺颂商祺，\n明远`;
      }

      composeBody.value = polishedText;
      const len = polishedText.replace(/\s+/g, '').length;
      wordCountEl.textContent = `${len} 字`;
      polishLabel.textContent = 'AI 一键美化';
      polishStatus.textContent = `已润色 · ${cfg.model || 'gpt-4o-mini'}`;
      polishStatus.classList.remove('hidden');
      undoPolishBtn.classList.remove('hidden');
      saveStatusEl.textContent = '草稿已自动保存 · 刚刚';
    });

    undoPolishBtn.addEventListener('click', () => {
      if (originalDraftBeforePolish !== null) {
        composeBody.value = originalDraftBeforePolish;
        const len = originalDraftBeforePolish.replace(/\s+/g, '').length;
        wordCountEl.textContent = `${len} 字`;
        originalDraftBeforePolish = null;
      }
      polishStatus.classList.add('hidden');
      undoPolishBtn.classList.add('hidden');
    });
  </script>


</body></html>
